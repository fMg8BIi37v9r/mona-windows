name: Mona Universal Windows Runner

on:
  workflow_dispatch:
    inputs:
      shell_choice:
        description: 'Pilihan Shell Terminal (powershell / bash / cmd)'
        required: true
        default: 'powershell'
        type: choice
        options:
          - powershell
          - bash
          - cmd

jobs:
  run-mona:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimal runtime GitHub Actions (6 Jam)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup WSL (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          set-as-default: true

      - name: Jalankan Mona Universal Binary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          SHELL_CHOICE: ${{ inputs.shell_choice }}
          GH_WORKSPACE: ${{ github.workspace }}
        shell: wsl-bash {0}
        run: |
          echo "=================================================="
          echo "    MEMULAI MONA DI WINDOWS GITHUB ACTIONS        "
          echo "=================================================="

          # 1. Ekspor rahasia Telegram & Cloudflare langsung ke environment WSL Linux
          export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          export TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          export CLOUDFLARE_TOKEN="${{ secrets.CLOUDFLARE_TOKEN }}"

          # 2. Pastikan tools Windows tersedia di PATH Linux WSL
          export PATH="$PATH:/mnt/c/Windows/System32:/mnt/c/Windows/System32/WindowsPowerShell/v1.0"

          # 3. Dapatkan path workspace di Linux WSL
          if [ -n "${GH_WORKSPACE:-}" ]; then
            WS_PATH=$(wslpath -u "$GH_WORKSPACE")
          else
            WS_PATH="$PWD"
          fi

          echo "[*] Workspace path: $WS_PATH"

          # 4. Siapkan binary mona di /root (native ext4)
          mkdir -p /root/mona
          cp -f "$WS_PATH/mona" /root/mona/mona
          chmod +x /root/mona/mona

          # 5. Tentukan Shell sesuai pilihan input workflow
          SHELL_MODE="${SHELL_CHOICE:-powershell}"
          if [ "$SHELL_MODE" = "powershell" ]; then
            echo "[*] Menggunakan Windows PowerShell sebagai shell terminal..."
            export TERMINAL_SHELL="powershell.exe -NoLogo"
          elif [ "$SHELL_MODE" = "cmd" ]; then
            echo "[*] Menggunakan Windows Command Prompt (cmd.exe)..."
            export TERMINAL_SHELL="cmd.exe"
          else
            echo "[*] Menggunakan Ubuntu Linux Bash..."
            unset TERMINAL_SHELL
          fi

          # 6. Atur working directory terminal agar langsung membuka root C:\ Windows
          export TERMINAL_DIR="/mnt/c"

          # 7. Masuk ke root C:\ Windows dan jalankan Mona
          # File Browser akan menampilkan seluruh isi drive C:\ Windows
          # Log TryCloudflare disensor di console publik demi keamanan
          cd /mnt/c
          /root/mona/mona 2>&1 | sed -u -E 's|https://[a-zA-Z0-9.-]+\.trycloudflare\.com|[LINK_DIKIRIM_KE_TELEGRAM_BOT_ANDA]|g'
